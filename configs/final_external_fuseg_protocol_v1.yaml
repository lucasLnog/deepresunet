metrics:
  primary: macro_per_unique_image_dice_at_frozen_threshold_0_18
  sensitivity: macro_per_unique_image_dice_at_fixed_threshold_0_5_for_DRIFT_only
  secondary:
    - macro_per_unique_image_iou
    - macro_per_unique_image_precision
    - macro_per_unique_image_recall
    - macro_per_unique_image_balanced_accuracy
    - macro_per_unique_image_boundary_iou_at_2_percent_diagonal
    - zero_dice_unit_count
  descriptive_only:
    - accuracy
    - specificity
    - external_minus_internal_DRIFT_metric_difference

statistics:
  absolute_DRIFT_confidence_interval: percentile_bootstrap_95_percent
  SAM_contrast: paired_mean_per_unique_image_difference
  SAM_confidence_interval: paired_percentile_bootstrap_95_percent
  SAM_hypothesis_test: paired_sign_flip_two_sided_for_Dice
  external_internal_gap: descriptive_unpaired_difference_no_model_selection
  bootstrap_samples: 10000
  permutation_samples: 50000
  random_seed: 20260929
  multiplicity: single_predefined_secondary_SAM_Dice_contrast_no_adjustment

visualization:
  panel_units: 12
  selection_rule: equally_spaced_after_lexical_sorting_of_canonical_ids
  performance_blind: true

execution_lock:
  preflight_must_pass: true
  checkpoint_sha256_recorded_at_preflight: true
  protocol_sha256_recorded_at_preflight: true
  manifest_sha256_recorded_at_preflight: true
  exclusions_sha256_recorded_at_preflight: true
  inference_before_preflight_allowed: false
  fine_tuning_on_FUSeg_allowed: false
  threshold_reselection_allowed: false
  checkpoint_reselection_allowed: false
  model_selection_on_FUSeg_allowed: false
  test_time_augmentation_allowed: false
  result_driven_rerun_allowed: false
  technical_failure_rerun: documented_only_before_scientific_interpretation
  panels_selected_by_performance_allowed: false

excluded_models:
  - DRIFTB
  - D0
  - P1
  - A1
  - P1A1
  - DRRT
  - DRIT
  - DRIF
  - MedSAM

