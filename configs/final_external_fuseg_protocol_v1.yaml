  role: frozen_primary_external_model
  seed: 42
  config: configs/fine_tuning_progressive.yaml
  run_id: DRIFT_seed42_20260903T033716Z
  run_directory: results/day10/DRIFT/DRIFT_seed42_20260903T033716Z
