base_config: configs/augmentation_d0_a1.yaml
protocol_version: 1
stage: day11_multiseed_confirmation
experiment_id: DR-IFT
scientific_role: imagenet_progressive_fine_tuning
seed: 2026
augmentation_randomness:
  seed_base: 2026000
  epoch_rule: seed_base_plus_epoch
  dataloader_rule: study_seed_plus_epoch
data:
  image_scale: zero_one_then_imagenet_standardization
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
model:
  architecture: deep_res_unet_resnet34
  provenance: DeepResUNet histórica com decoder residual e attention gates preservados
  in_channels: 3
  classes: 1
  activation: null
  encoder_weights: imagenet
  pretrained: false
  freeze_encoder: true
fine_tuning:
  strategy: progressive
  decoder_learning_rate: 0.001
  encoder_learning_rate: 0.0001
  minimum_epochs_before_stopping: 31
  phases:
    - start_epoch: 1
      trainable_encoder_stages: []
    - start_epoch: 16
      trainable_encoder_stages: [layer4]
    - start_epoch: 31
      trainable_encoder_stages: [layer3, layer4]
runtime:
  device: auto
  run_prefix: DRIFT_seed2026
  output_root: results/day11/seed2026/DRIFT
  resume_supported: true
